name: Berkeley seat monitor
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = monitor, dry-run = access check, test-telegram = connection test'
        type: choice
        options: [check, dry-run, test-telegram]
        default: check
permissions:
  contents: write
concurrency:
  group: berkeley-seat-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check seats or test setup
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          case "$MODE" in
            dry-run) python monitor.py --dry-run ;;
            test-telegram) python monitor.py --test-telegram ;;
            check) python monitor.py ;;
            *) exit 1 ;;
          esac
